{% extends 'base.html' %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="err-page"><div>
  <b>{{ code }}</b>
  <h2 style="margin-top:12px">{{ message }}</h2>
  <p class="muted" style="margin-top:8px">If you think this is a mistake, tell the system administrator.</p>
  <a class="btn primary" style="margin-top:14px" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</div></div>
{% endblock %}
